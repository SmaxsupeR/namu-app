name: TTS Lab Android APK

on:
  push:
    branches:
      - feature/tts-lab-auto-dual-benchmark
    paths:
      - 'labs/tts-lab/**'
      - '.github/workflows/tts-lab-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: labs/tts-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: labs/tts-lab/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK already provided by GitHub runner: $ANDROID_SDK_ROOT"
        working-directory: .
      - name: Install JS dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build arm64 APK
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: namu-tts-lab-auto-dual-arm64
          path: labs/tts-lab/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
